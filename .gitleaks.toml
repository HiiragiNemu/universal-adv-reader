title = "Universal ADV source publication: all default rules plus narrow native-field exceptions"
[extend]
useDefault = true

# Exact game media basenames were verified against adjacent playbackPath fields.
# Do not ignore whole files, arbitrary keys, or any provider-specific token rule.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Native media basename, not an API credential"
condition = "AND"
regexTarget = "match"
