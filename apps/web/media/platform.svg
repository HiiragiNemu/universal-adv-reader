<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic night platform</title>
  <desc id="desc">A clean-room geometric fixture used to verify image routing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.62" stop-color="#17334c"/>
      <stop offset="1" stop-color="#486675"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d3940"/>
      <stop offset="0.55" stop-color="#53636a"/>
      <stop offset="1" stop-color="#27333a"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1240" cy="172" r="58" fill="#dceeff" opacity=".78" filter="url(#glow)"/>
  <circle cx="1240" cy="172" r="42" fill="#eff8ff"/>
  <path d="M0 540 L1600 430 L1600 900 L0 900 Z" fill="url(#platform)"/>
  <path d="M0 676 L1600 550" stroke="#f6d267" stroke-width="18" opacity=".92"/>
  <path d="M0 711 L1600 585" stroke="#f5f1d8" stroke-width="7" stroke-dasharray="42 28" opacity=".74"/>
  <g fill="#101b24" opacity=".9">
    <rect x="120" y="220" width="20" height="370"/>
    <rect x="510" y="190" width="20" height="360"/>
    <rect x="900" y="158" width="20" height="340"/>
    <rect x="1285" y="125" width="20" height="330"/>
  </g>
  <g stroke="#8ea7b5" stroke-width="8" opacity=".68">
    <path d="M0 258 L1600 128"/>
    <path d="M0 286 L1600 156"/>
  </g>
  <g fill="#b7d9e9">
    <rect x="75" y="312" width="124" height="12" rx="6"/>
    <rect x="465" y="282" width="124" height="12" rx="6"/>
    <rect x="855" y="249" width="124" height="12" rx="6"/>
  </g>
  <text x="80" y="825" fill="#e7f3f8" font-family="system-ui, sans-serif" font-size="30" letter-spacing="7" opacity=".72">ADV ROUTE FIXTURE · PLATFORM</text>
</svg>
