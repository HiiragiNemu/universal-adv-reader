<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universal ADV Reader · Responsive QA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #02070b; color: #dcecf2; }
    body { display: grid; place-items: start center; overflow: auto; font: 12px/1.4 ui-monospace, monospace; }
    #label { position: fixed; z-index: 2; top: 8px; right: 10px; padding: 5px 8px; border: 1px solid #315466; border-radius: 999px; background: #07131c; color: #8fdcec; }
    #viewport { transform-origin: top left; box-shadow: 0 0 0 1px #315466, 0 24px 80px #000; }
    iframe { display: block; border: 0; background: #061019; }
  </style>
</head>
<body>
  <div id="label"></div>
  <div id="viewport"><iframe id="app" title="Universal ADV Reader QA viewport"></iframe></div>
  <script>
    const params = new URLSearchParams(location.search);
    const width = Math.max(320, Number(params.get('w')) || 375);
    const height = Math.max(320, Number(params.get('h')) || 800);
    const frame = document.querySelector('#app');
    const viewport = document.querySelector('#viewport');
    const fit = Math.min(1, (innerWidth - 24) / width, (innerHeight - 24) / height);
    frame.style.width = `${width}px`;
    frame.style.height = `${height}px`;
    viewport.style.width = `${width}px`;
    viewport.style.height = `${height}px`;
    viewport.style.transform = `scale(${fit})`;
    document.body.style.width = `${Math.ceil(width * fit)}px`;
    document.body.style.height = `${Math.ceil(height * fit)}px`;
    document.querySelector('#label').textContent = `${width}×${height} · ${Math.round(fit * 100)}%`;
    frame.src = `/apps/web/?qa=${width}x${height}`;
  </script>
</body>
</html>
